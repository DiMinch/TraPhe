debug: false
spring:
  threads:
    virtual:
      enabled: true
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://aws-1-ap-northeast-1.pooler.supabase.com:6543/postgres?prepareThreshold=0}
    username: ${DB_USERNAME:postgres.irzskouxozoygfjbgkuq}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_batch_fetch_size: 30
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  # Redis — Upstash free tier (or local)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}

  # Mail — Mailtrap sandbox (no real emails sent)
  mail:
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

app:
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-key-change-in-production-please-do-not-use-this-in-prod}
    access-token-expiration: 900000       # 15 minutes in ms
    refresh-token-expiration: 604800000   # 7 days in ms
  otp:
    expiration: 300    # 5 minutes in seconds
    length: 6          # 6-digit OTP
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE:DEMOV210}
    hash-secret: ${VNPAY_HASH_SECRET:}
    url: ${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    return-url: ${VNPAY_RETURN_URL:http://localhost:5173/order/payment-callback}
  momo:
    partner-code: ${MOMO_PARTNER_CODE:MOMO}
    access-key: ${MOMO_ACCESS_KEY:}
    secret-key: ${MOMO_SECRET_KEY:}
    url: ${MOMO_URL:https://test-payment.momo.vn/v2/gateway/api/create}
    return-url: ${MOMO_RETURN_URL:http://localhost:5173/order/payment-callback}
    ipn-url: ${MOMO_IPN_URL:http://localhost:8080/api/payment/momo-ipn}

supabase:
  url: ${SUPABASE_URL:https://irzskouxozoygfjbgkuq.supabase.co}
  service-key: ${SUPABASE_SERVICE_KEY:}
  storage:
    bucket: menu-images
